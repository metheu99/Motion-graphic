<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #050507; --ink: #f4f4f6; --accent: #e82127; --dim: #8a8d96; --font-display: "Outfit"; --font-mono: "Space Mono"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); font-family: var(--font-display); color: var(--ink); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,5,7,.78) 0%, rgba(5,5,7,.15) 55%, rgba(5,5,7,0) 100%); }
      .shade-b { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,5,7,.85) 0%, rgba(5,5,7,0) 50%); }
      .mono { font-family: var(--font-mono); font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); }
      .line { position: absolute; display: flex; overflow: hidden; }
      .ch { display: inline-block; }
      .huge { font-weight: 900; font-size: 260px; line-height: .9; letter-spacing: -.045em; }
      .outline { color: transparent; -webkit-text-stroke: 3px var(--ink); }
      .red { color: var(--accent); }
      .bar { position: absolute; height: 4px; background: var(--accent); transform-origin: left center; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 120px 120px; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 50; pointer-events: none; }
      .hud { position: absolute; left: 192px; bottom: 120px; }
      .stat { font-weight: 900; font-size: 150px; letter-spacing: -.04em; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">

      <!-- S1 0–3.75 : statement on black -->
      <div id="s1" class="scene clip" data-start="0" data-duration="3.75" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow>
        <div class="grid" id="s1grid"></div>
        <div class="bar" id="s1bar" style="left:192px; top:600px; width:1536px;"></div>
        <div class="line" id="s1a" style="left:192px; top:300px;"><span class="huge" data-var-text="s1a">THE FUTURE</span></div>
        <div class="mono" id="s1m" style="position:absolute; left:196px; top:640px;">isn't coming —</div>
      </div>

      <!-- S2 3.75–7.5 : hero reveal -->
      <div id="s2" class="scene clip" data-start="3.75" data-duration="3.75" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow>
        <img id="s2img" class="bg" src="assets/img/Model-Y-Hero-Desktop-US.jpg" data-var-src="hero" />
        <div class="shade"></div>
        <div class="line" id="s2a" style="left:192px; top:220px;"><span class="huge" style="font-size:300px">IT'S</span></div>
        <div class="line" id="s2b" style="left:192px; top:480px;"><span class="huge red" style="font-size:300px">HERE.</span></div>
      </div>

      <!-- S3 7.5–15 : four-word cut sequence -->
      <div id="s3" class="scene clip" data-start="7.5" data-duration="7.5" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow data-layout-allow-overlap>
        <div class="scene" id="c1"><img id="c1i" class="bg" src="assets/img/Model-Y-Premium-Exterior-Desktop-NA.jpg" /><div class="shade-b"></div>
          <div class="line" style="left:150px; bottom:110px;"><span class="huge outline" id="w1">ELECTRIC</span></div></div>
        <div class="scene" id="c2"><img id="c2i" class="bg" src="assets/img/Model-Y-Premium-Exterior-Carousel-Slide-2-Desktop.jpg" /><div class="shade-b"></div>
          <div class="line" style="left:150px; bottom:110px;"><span class="huge" id="w2">INTELLIGENT</span></div></div>
        <div class="scene" id="c3"><img id="c3i" class="bg" src="assets/img/Model-Y-Exterior-Carousel-Slide-3-Desktop.png" /><div class="shade-b"></div>
          <div class="line" style="left:150px; bottom:110px;"><span class="huge outline" id="w3">FEARLESS</span></div></div>
        <div class="scene" id="c4"><img id="c4i" class="bg" src="assets/img/Model-Y-Premium-Remote-Desktop-NA.jpg" /><div class="shade-b"></div>
          <div class="line" style="left:150px; bottom:110px;"><span class="huge red" id="w4">LIMITLESS</span></div></div>
        <div class="mono" id="s3tc" style="position:absolute; right:150px; top:110px;">MODEL Y / 01—04</div>
      </div>

      <!-- S4 15–22.5 : drop — performance + safety stats -->
      <div id="s4" class="scene clip" data-start="15" data-duration="7.5" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow data-layout-allow-overlap>
        <div class="scene" id="p1"><img id="p1i" class="bg" src="assets/img/Model-Y-Performance-Hero-Desktop-NA.jpg" /><div class="shade"></div>
          <div class="hud" id="h1"><div class="mono">Dual Motor · All-Wheel Drive</div><div class="stat"><span class="red">AWD</span> PERFORMANCE</div></div></div>
        <div class="scene" id="p2"><img id="p2i" class="bg" src="assets/img/Model-Y-Premium-Safety-Desktop-NA.jpg" /><div class="shade"></div>
          <div class="hud" id="h2"><div class="mono">Engineered to protect</div><div class="stat">5<span class="red">★</span> SAFETY</div></div></div>
        <div class="bar" id="s4bar" style="left:0; top:0; width:1920px; height:8px;"></div>
      </div>

      <!-- S5 22.5–27.5 : MODEL Y title -->
      <div id="s5" class="scene clip" data-start="22.5" data-duration="5" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow>
        <img id="s5img" class="bg" src="assets/img/Model-Y-L-Hero-Desktop-NA.jpg" />
        <div class="shade-b"></div>
        <div class="line" id="s5t" style="left:0; width:1920px; justify-content:center; top:120px;">
          <span class="huge" style="font-size:320px; letter-spacing:.02em;">MODEL&nbsp;Y</span></div>
        <div class="mono" id="s5m" style="position:absolute; left:0; width:1920px; text-align:center; top:470px; color:var(--ink);">Pure electric · Pure intelligence</div>
      </div>

      <!-- S6 27.5–30 : brand end card -->
      <div id="s6" class="scene clip" data-start="27.5" data-duration="2.5" data-track-index="0" data-track-kind="graphics">
        <div id="s6logo" style="position:absolute; left:0; width:1920px; top:400px; text-align:center; font-weight:700; font-size:130px; letter-spacing:.55em; padding-left:.55em;">TESLA</div>
        <div class="bar" id="s6bar" style="left:860px; top:590px; width:200px;"></div>
        <div class="mono" id="s6s" style="position:absolute; left:0; width:1920px; top:640px; text-align:center; color:var(--ink); font-size:24px;" data-var-text="slogan">Accelerating the world's transition to sustainable energy</div>
      </div>

      <div class="flash" id="fx"></div>

      <audio id="bgm" class="clip" src="assets/audio/bgm.wav" data-start="0" data-duration="30" data-track-index="10" data-volume="0.8"></audio>
      <audio id="vo1" class="clip" src="assets/audio/vo1.wav" data-start="22.6" data-duration="3.1" data-track-index="11" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/audio/vo2.wav" data-start="25.7" data-duration="4.3" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      // split the S1 headline into letters (markup authored, letters animated)
      const s1 = document.querySelector("#s1a span");
      s1.innerHTML = s1.textContent.split("").map(c => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");

      const tl = gsap.timeline({ paused: true });
      const flash = (t) => tl.fromTo("#fx", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);

      // S1
      tl.fromTo("#s1grid", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 3.5, ease: "power2.out" }, 0);
      tl.fromTo("#s1a .ch", { yPercent: 110, rotateX: -80, opacity: 0 }, { yPercent: 0, rotateX: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.05 }, 0.25);
      tl.fromTo("#s1bar", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.inOut" }, 0.9);
      tl.fromTo("#s1m", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.5);
      tl.to("#s1a .ch", { yPercent: -110, opacity: 0, duration: 0.35, ease: "expo.in", stagger: 0.02 }, 3.25);
      tl.to(["#s1bar", "#s1m"], { opacity: 0, duration: 0.25 }, 3.45);

      // S2
      flash(3.75);
      tl.fromTo("#s2img", { scale: 1.25 }, { scale: 1.02, duration: 3.75, ease: "power2.out" }, 3.75);
      tl.fromTo("#s2a span", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 3.95);
      tl.fromTo("#s2b span", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 4.2);
      tl.to(["#s2a span", "#s2b span"], { xPercent: -8, duration: 3, ease: "none" }, 4.5);

      // S3 hard cuts every 1.875 s on the beat
      ["c1", "c2", "c3", "c4"].forEach((id, i) => {
        const t = 7.5 + i * 1.875;
        tl.set(`#${id}`, { opacity: 0 }, 0);
        tl.set(`#${id}`, { opacity: 1 }, t);
        if (i < 3) tl.set(`#${id}`, { opacity: 0 }, t + 1.875);
        tl.fromTo(`#${id}i`, { scale: 1.18, xPercent: i % 2 ? 3 : -3 }, { scale: 1.04, xPercent: 0, duration: 1.875, ease: "power1.out" }, t);
        tl.fromTo(`#w${i + 1}`, { xPercent: i % 2 ? -60 : 60, opacity: 0, skewX: i % 2 ? 12 : -12 }, { xPercent: 0, opacity: 1, skewX: 0, duration: 0.55, ease: "expo.out" }, t + 0.05);
        tl.to(`#w${i + 1}`, { xPercent: i % 2 ? 6 : -6, duration: 1.2, ease: "none" }, t + 0.6);
      });
      tl.fromTo("#s3tc", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.6);

      // S4 drop
      flash(15);
      tl.fromTo("#s4bar", { scaleX: 0 }, { scaleX: 1, duration: 7.4, ease: "none" }, 15);
      tl.set("#p2", { opacity: 0 }, 0);
      tl.fromTo("#p1i", { scale: 1.3, xPercent: 4 }, { scale: 1.05, xPercent: 0, duration: 3.75, ease: "power3.out" }, 15);
      tl.fromTo("#h1 > *", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.12 }, 15.3);
      tl.set("#p2", { opacity: 1 }, 18.75);
      flash(18.75);
      tl.fromTo("#p2i", { scale: 1.25 }, { scale: 1.04, duration: 3.75, ease: "power3.out" }, 18.75);
      tl.fromTo("#h2 > *", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.12 }, 19.0);
      tl.to("#h2", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 22.1);

      // S5 title
      tl.fromTo("#s5img", { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 5, ease: "power2.out" }, 22.5);
      tl.fromTo("#s5t span", { yPercent: 100, scaleX: 1.35, opacity: 0 }, { yPercent: 0, scaleX: 1, opacity: 1, duration: 1.4, ease: "expo.out" }, 22.7);
      tl.fromTo("#s5m", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 23.6);
      tl.to(["#s5t", "#s5m"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 27.0);
      tl.to("#s5img", { opacity: 0, duration: 0.5 }, 27.0);

      // S6 end card
      flash(27.5);
      tl.fromTo("#s6logo", { opacity: 0, scaleX: 1.4 }, { opacity: 1, scaleX: 1, duration: 1.4, ease: "expo.out" }, 27.55);
      tl.fromTo("#s6bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 27.9);
      tl.fromTo("#s6s", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 28.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
